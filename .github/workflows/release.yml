name: "Publish Release"

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: ""
          - platform: "windows-latest"
            args: ""
          - platform: "ubuntu-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack (for pnpm)
        run: corepack enable
      
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Download and rename Tauri sidecar binaries
        shell: bash
        run: |
          set -e
          mkdir -p src-tauri/binaries
          HOST="github.com"
          CURL_OPTS="-fL --retry 3 --retry-delay 5 --http1.1"

          dl() {
            curl $CURL_OPTS -o "$1" "https://${HOST}/$2/releases/download/$3/$4"
          }

          if [ "${{ matrix.platform }}" == "windows-latest" ]; then
            # 1. FFmpeg & FFprobe (Windows x86_64)
            dl ffmpeg.zip "BtbN/FFmpeg-Builds" "latest" "ffmpeg-master-latest-win64-gpl.zip"
            7z x ffmpeg.zip -offmpeg_extracted
            find ffmpeg_extracted -name "ffmpeg.exe" -type f -exec mv {} src-tauri/binaries/mediaProcessor-x86_64-pc-windows-msvc.exe \;
            find ffmpeg_extracted -name "ffprobe.exe" -type f -exec mv {} src-tauri/binaries/mediaProcessProbe-x86_64-pc-windows-msvc.exe \;
            rm -rf ffmpeg.zip ffmpeg_extracted

            # 2. ImageMagick (Windows x86_64)
            dl imagemagick.7z "ImageMagick/ImageMagick" "7.1.2-36" "ImageMagick-7.1.2-36-portable-Q16-HDRI-x64.7z"
            7z x imagemagick.7z -oimagemagick_extracted
            find imagemagick_extracted -name "magick.exe" -type f -exec mv {} src-tauri/binaries/imageProcessor-x86_64-pc-windows-msvc.exe \;
            rm -rf imagemagick.7z imagemagick_extracted

          elif [ "${{ matrix.platform }}" == "ubuntu-latest" ]; then
            # 1. FFmpeg & FFprobe (Linux x86_64)
            dl ffmpeg.tar.xz "BtbN/FFmpeg-Builds" "latest" "ffmpeg-master-latest-linux64-gpl.tar.xz"
            mkdir -p ffmpeg_extracted
            tar -xf ffmpeg.tar.xz -C ffmpeg_extracted
            find ffmpeg_extracted -name "ffmpeg" -type f -exec mv {} src-tauri/binaries/mediaProcessor-x86_64-unknown-linux-gnu \;
            find ffmpeg_extracted -name "ffprobe" -type f -exec mv {} src-tauri/binaries/mediaProcessProbe-x86_64-unknown-linux-gnu \;
            rm -rf ffmpeg.tar.xz ffmpeg_extracted

            # 2. ImageMagick AppImage (Single standalone executable)
            dl src-tauri/binaries/imageProcessor-x86_64-unknown-linux-gnu "ImageMagick/ImageMagick" "7.1.2-36" "ImageMagick-7.1.2-36-x86_64.AppImage"

            chmod +x src-tauri/binaries/mediaProcessor-x86_64-unknown-linux-gnu \
                     src-tauri/binaries/mediaProcessProbe-x86_64-unknown-linux-gnu \
                     src-tauri/binaries/imageProcessor-x86_64-unknown-linux-gnu

          elif [ "${{ matrix.platform }}" == "macos-latest" ]; then
            # 1. FFmpeg & FFprobe (macOS arm64)
            dl src-tauri/binaries/mediaProcessor-aarch64-apple-darwin "descriptinc/ffmpeg-ffprobe-static" "b6.1.2-rc.1" "ffmpeg-darwin-arm64"
            dl src-tauri/binaries/mediaProcessProbe-aarch64-apple-darwin "descriptinc/ffmpeg-ffprobe-static" "b6.1.2-rc.1" "ffprobe-darwin-arm64"

            # 2. ImageMagick (macOS arm64 portable)
            dl imagemagick.tar.xz "ImageMagick/ImageMagick" "7.1.2-36" "ImageMagick-7.1.2-36-portable-Q16-HDRI-macos-arm64.tar.xz"
            mkdir -p imagemagick_extracted
            tar -xf imagemagick.tar.xz -C imagemagick_extracted
            find imagemagick_extracted -name "magick" -type f -exec mv {} src-tauri/binaries/imageProcessor-aarch64-apple-darwin \;
            rm -rf imagemagick.tar.xz imagemagick_extracted

            chmod +x src-tauri/binaries/mediaProcessor-aarch64-apple-darwin \
                     src-tauri/binaries/mediaProcessProbe-aarch64-apple-darwin \
                     src-tauri/binaries/imageProcessor-aarch64-apple-darwin
          fi

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri App & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: "v__VERSION__"
          releaseName: "MediaKit v__VERSION__"
          releaseBody: "Automated release for MediaKit."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}